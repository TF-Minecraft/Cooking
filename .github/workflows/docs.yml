name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate documentation manifest
        run: python scripts/test_doc_manifest.py
      - name: Check internal links
        run: python scripts/check-links.py
      - name: Check documentation impact
        run: python scripts/check-doc-impact.py
