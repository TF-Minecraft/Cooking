name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation manifest
        run: python scripts/test_doc_manifest.py
      - name: Check internal links
        run: python scripts/check-links.py
      - name: Check documentation impact
        run: python scripts/check-doc-impact.py

      # mvn test needs the system-scoped Spigot and sibling-plugin jars, plus the pinned Maven TLibs input
      # from pom.xml. Those files are not on GitHub runners. Run mvn test locally.
