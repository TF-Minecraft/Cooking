# Popcorn machine (Cooking popcorn-machines.yml, InteractibleFurniture popcorn_machine): the cabinet, its kettle
# (empty and with kernels) and the heap of popcorn at four heights, plain, caramel and buttered (bin/machine.py).
# Caramel popcorn (models.yml popcorn caramel) uses tfmc_pack's existing food/caramelcorn texture; buttered popcorn
# is the popcorn icon glazed yellow (bin/buttered.py). Caramel itself
# uses the existing tfmc_cooking:caramel item.
