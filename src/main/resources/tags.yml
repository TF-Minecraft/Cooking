
#########Do not change these unless you know
# craft-quality-pct: upward star-roll bonus when this step is active on an extra ingredient (e.g. 0.05 = +5% craft quality)
# stars: added to inherited quality while this step is active. Negative lowers the star rating.
# Age values are seconds at age.freshness 1.0 (stale = 1 day, rotten = 1.25 days).
# Per-type duration is types.yml age.freshness (higher = lasts longer).
freshness:
  ageable: true
  fresh:
    name: "#72ed9fFresh"
    value: 0
    nutrition-mult: 1.5
  stale:
    name: "#c3db81Stale"
    value: 86400
    nutrition-mult: 0.8
    quality-reduce: 0.25
  rotten:
    name: "#0a6935Rotten"
    value: 108000
    nutrition-mult: 0.05
    food-mult: 0.6
    quality-reduce: 0.75
