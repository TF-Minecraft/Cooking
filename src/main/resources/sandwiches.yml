# Sandwiches, built on a board:
#   1. Right-click an empty board with a slice of bread.
#   2. Right-click with fillings to lay them on it (an empty hand takes the top one back off).
#   3. Right-click with another slice of bread to close it.
#   4. Right-click the closed sandwich to pick it up.
# The sandwich's food is what its layers hold between them, its nutrition their average (weighted by food), and its
# quality, freshness and variety come from all of them (composition.yml context SANDWICH). Its fillings name it:
# "Cheese, Tomato and Strawberry Jam Sandwich" (naming.yml fillers max).
#
# The furniture needs slots sandwich_1, sandwich_2, ... (InteractibleFurniture), one per layer, at the furniture's
# centre with scale 1 and interactible: false. Each layer model is drawn lying on the furniture, in its coordinates;
# Cooking lifts each layer by the thickness of those below it.

# Furniture ids sandwiches are built on.
furniture:
  - cutting_board

# Fillings between the two slices, at most (and no more than the furniture's sandwich slots allow).
max-fillings: 6

# The finished sandwich (types.yml). Food and nutrition are replaced by its layers'.
output: meal(type=sandwich;origin=Mixed)

# Tags a sandwich earns from its layers, like a soup's Seasoned or Thick (tags.yml tracks; their multipliers apply).
#   track      the tags.yml track; step picks one of its steps (default: its first)
#   count      fillings: the number of fillings, with steps giving the step reached at each count
#   layers     every one of these layers (ids below); min: each at least this often
#   any-of     at least one of these layers
#   valuable   a food types.yml marks valuable (tomato, onion, lettuce, cucumber, corn)
#   addons     rounded: a chopped garnish and a spice; aromatic: two of one kind
bonuses:
  size:
    track: dish_size
    count: fillings
    steps:
      3: hearty
      5: loaded
  buttered:
    track: buttered
    layers: [butter]
  well_rounded:
    track: well_rounded
    layers: [cheese, vegetable]
    any-of: [jam, paste, catsup, mustard, butter]
  flavourful:
    track: flavourful
    valuable: true

# The kind of sandwich its fillings make (the bread doesn't count); the first that matches wins. The sandwich takes
# the kind as its origin, so types.yml sandwich overrides give each kind its own look and name (a Hamburger). A kind
# beats a layer's sandwich-origin, so a hamburger with jam is still a Hamburger; with no kind the first layer with a
# sandwich-origin sets it (Jam), and with neither the sandwich keeps the output's origin.
#   layers      every one of these fillings (layer ids below)
#   only        nothing but these fillings
#   origins     every one of these origins
#   any-origin  at least one of these origins
#   mostly      at least half the fillings are this origin
#   tags        per layer, the tag steps (tags.yml) its fillings must be at, any one of them: meat: [cooked] takes
#               fried meat only, so raw, boiled or burnt beef makes a plain Beef Sandwich
kinds:
  Cheeseburger:
    layers: [meat, cheese]
    origins: [Beef]
    tags:
      meat: [cooked]
  Hamburger:
    layers: [meat]
    origins: [Beef]
    tags:
      meat: [cooked]
  BLT:
    layers: [meat, vegetable]
    origins: [Pork, Lettuce, Tomato]
    tags:
      meat: [cooked]

# What can go in a sandwich, matched by types.yml type; the first layer that takes a food wins.
#   bread: true    a slice that starts and closes the sandwich (it doesn't name it)
#   name           the filling's part of the sandwich's name; {origin} is the food's origin (Strawberry)
#   names          a name per origin instead (goat: Goat Cheese)
#   sandwich-origin  a sandwich with this layer takes this origin (the first such layer wins), so types.yml
#                  overrides can give it its own look and name (a jam sandwich)
#   thickness      how high the layer lies, in model pixels (1/16 block)
#   models         its look on the board: a model, or a tag and a model used while the food has that tag (rotten).
#                  The first that exists is used, so later lines are fallbacks. {origin} is the origin in lower case
#                  with _ for spaces (melon_slice). With none, the layer shows as it does in hand.
layers:
  bread:
    types:
      - bread_slice
    bread: true
    thickness: 0.8
    models:
      - rotten ia.tfmc_cooking:sandwich_bread_rotten
      - burnt ia.tfmc_cooking:sandwich_bread_burnt
      - ia.tfmc_cooking:sandwich_bread_cooked
  jam:
    types:
      - jam
    name: "{origin} Jam"
    names:
      melon slice: Melon Jam
    sandwich-origin: Jam
    thickness: 0.3
    models:
      - ia.tfmc_cooking:sandwich_jam_{origin}
      - ia.tfmc_cooking:sandwich_jam_strawberry
  paste:
    types:
      - paste
    name: "{origin} Paste"
    thickness: 0.3
    models:
      - ia.tfmc_cooking:sandwich_paste_{origin}
      - ia.tfmc_cooking:sandwich_paste_tomato
  catsup:
    types:
      - catsup
    name: Catsup
    thickness: 0.3
    models:
      - ia.tfmc_cooking:sandwich_catsup
  mustard:
    types:
      - mustard
    name: Mustard
    thickness: 0.3
    models:
      - ia.tfmc_cooking:sandwich_mustard
  butter:
    types:
      - butter
    name: Butter
    thickness: 0.2
    models:
      - ia.tfmc_cooking:sandwich_butter
  cheese:
    types:
      - cheese
    name: Cheese
    names:
      goat: Goat Cheese
    thickness: 0.5
    models:
      - ia.tfmc_cooking:sandwich_cheese_{origin}
      - ia.tfmc_cooking:sandwich_cheese
  vegetable:
    types:
      - vegetable_cut
      - vegetable_cut_2
      - vegetable_chopped
      - vegetable_chopped_2
      - garnish_chopped
    name: "{origin}"
    thickness: 0.3
    models:
      - rotten ia.tfmc_cooking:sandwich_vegetable_{origin}_rotten
      - ia.tfmc_cooking:sandwich_vegetable_{origin}
      - ia.tfmc_cooking:sandwich_vegetable_lettuce
  meat:
    # Fried (or raw, boiled, burnt) cuts of meat and sausage. Sausage's origin is Mixed.
    types:
      - meat_red_meat
      - meat_pork
      - meat_poultry
      - meat_poultry_leg
      - sausage
    name: "{origin}"
    names:
      mixed: Sausage
    thickness: 0.5
    # A patty, bacon rashers for pork (sandwich_meat_pork) and sausage slices (sandwich_meat_mixed).
    models:
      - rotten ia.tfmc_cooking:sandwich_meat_{origin}_rotten
      - rotten ia.tfmc_cooking:sandwich_meat_rotten
      - burnt ia.tfmc_cooking:sandwich_meat_{origin}_burnt
      - burnt ia.tfmc_cooking:sandwich_meat_burnt
      - boiled ia.tfmc_cooking:sandwich_meat_boiled
      - raw ia.tfmc_cooking:sandwich_meat_{origin}_raw
      - raw ia.tfmc_cooking:sandwich_meat_raw
      - ia.tfmc_cooking:sandwich_meat_{origin}
      - ia.tfmc_cooking:sandwich_meat
