# Tag tracks that contribute a name PREFIX (plain text after hex strip, trailing space added)
prefix-tracks:
  - sweet
  - butter_salted
  - butter_spiced
  # Popcorn machine toppings, in this order: Buttered Sugared Salted Caramel Popcorn.
  - topping_butter
  - topping_sugar
  - topping_salt
  - topping_caramel

# Max filler origins shown in a composed name
fillers:
  max: 3

addons:
  max: 2

dough-fillers:
  max: 2

# Map ingredient origins to display adjectives in {fillers} names
origin-adjectives:
  "Spice Leaf": Spiced
  "Brown Mushroom": Mushroom
  "Red Mushroom": Mushroom

# Category buckets for station logic
categories:
  seasoning:
    - salt
    - pepper
  sweetener:
    - sweetener
  addon:
    - garnish
    - spice
  dough-filler:
    - fruit

# Per-category tag step display overrides (fallback after per-type tag-labels)
tag-label-defaults:
  dairy:
    freshness:
      stale: "#c3db81Sour"
      rotten: "#8B7355Spoiled"
