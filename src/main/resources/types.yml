###Veggies — chopped garnish CustomCrops (chopped corn pops into popcorn in the frying pan)
vegetable_chopped_2:
  name: "#5dad58{inherit} (Chopped)"
  valuable: true
  overrides:
    TOMATO:
      model: tomato_chopped
    ONION:
      model: onion_chopped
    LETTUCE:
      model: lettuce_chopped
    CUCUMBER:
      model: cucumber_chopped
    CORN:
      model: corn_chopped
  model: tomato_chopped
  food: 11
  nutrition: 7.5
  # output: the food (a food string) the piece turns into once it's done, here popcorn. It keeps the piece's stars,
  # freshness, lineage and ingredients, and its origin when the string names none, and goes on cooking by the same
  # clock, so it burns as popcorn. A type whose only options have an output isn't raw until it's in the pan, so
  # chopped tomatoes keep their values. The pan's slot whitelist (InteractibleFurniture) lets only corn in:
  # c.garnish(type=vegetable_chopped_2;origin=Corn).
  cooking-options:
    frying_pan:
      tag: 1
      time: 15
      burn: 30
      output: snack(type=popcorn;origin=Corn)
  age:
    warmth: 450
    freshness: 4

