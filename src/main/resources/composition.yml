# Composition roles and modifier tuning.
# legacy-mode: false enables mains/extras pipeline on all compose stations.
# Sausage maker meat inputs use the default mains role (average quality + freshness).

legacy-mode: false

roles:
  main: []
  extra:
    - seasoning
    - sweetener
    - flour
    - salt
    - pepper
  neutral: []

context-overrides:
  MIXING_BOWL:
    extra:
      - sweetener
  SAUCE_SCOOP:
    extra:
      - salt
      - pepper
      - sweetener
      - flour
  SOUP_SCOOP:
    extra:
      - salt
      - pepper
  CHURN:
    extra:
      - salt
      - spice
      - seasoning
  FRYING_PAN:
    extra:
      - dairy
  SAUSAGE_MAKER:
    extra: []
  SALAD:
    extra:
      - salt
      - pepper
      - spice
      - oil
      - vinegar

modifiers:
  enabled: true
  gap-up-chance-per-star: 0.12
  gap-down-chance-per-star: 0.15
  craft-quality-pct-bonus: true
