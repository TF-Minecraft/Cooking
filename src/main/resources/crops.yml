# Crop harvest quality + growth gate (Cooking). Spec: https://github.com/TF-Minecraft/Docs/blob/main/projects/Cooking/docs/crops.md
# Produce stars roll from province fertility × crop affection, then pickup permissions.
# Growth ticks use the same affection: chance = (fertility/100) ^ affection.
# Seeds stay untagged IA/vanilla. CustomCrops one-seed drops stay yield/balance.

growth-gate:
  enabled: true

harvest-quality:
  rich:
    1: 8
    2: 16
    3: 28
    4: 28
    5: 20
  poor:
    1: 40
    2: 28
    3: 18
    4: 10
    5: 4

