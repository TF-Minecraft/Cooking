COPPER_LANTERN, EXPOSED_COPPER_LANTERN, WEATHERED_COPPER_LANTERN, OXIDIZED_COPPER_LANTERN, WAXED_COPPER_LANTERN, WAXED_EXPOSED_COPPER_LANTERN, WAXED_WEATHERED_COPPER_LANTERN, WAXED_OXIDIZED_COPPER_LANTERN, COPPER_CHAIN, EXPOSED_COPPER_CHAIN, WEATHERED_COPPER_CHAIN, OXIDIZED_COPPER_CHAIN, WAXED_COPPER_CHAIN, WAXED_EXPOSED_COPPER_CHAIN, WAXED_WEATHERED_COPPER_CHAIN, WAXED_OXIDIZED_COPPER_CHAIN, COPPER_BARS, EXPOSED_COPPER_BARS, WEATHERED_COPPER_BARS, OXIDIZED_COPPER_BARS, WAXED_COPPER_BARS, WAXED_EXPOSED_COPPER_BARS, WAXED_WEATHERED_COPPER_BARS, WAXED_OXIDIZED_COPPER_BARS, OAK_HANGING_SIGN, OAK_WALL_HANGING_SIGN, SPRUCE_HANGING_SIGN, SPRUCE_WALL_HANGING_SIGN, BIRCH_HANGING_SIGN, BIRCH_WALL_HANGING_SIGN, JUNGLE_HANGING_SIGN, JUNGLE_WALL_HANGING_SIGN, ACACIA_HANGING_SIGN, ACACIA_WALL_HANGING_SIGN, DARK_OAK_HANGING_SIGN, DARK_OAK_WALL_HANGING_SIGN, MANGROVE_HANGING_SIGN, MANGROVE_WALL_HANGING_SIGN, CHERRY_HANGING_SIGN, CHERRY_WALL_HANGING_SIGN, PALE_OAK_HANGING_SIGN, PALE_OAK_WALL_HANGING_SIGN, BAMBOO_HANGING_SIGN, BAMBOO_WALL_HANGING_SIGN, CRIMSON_HANGING_SIGN, CRIMSON_WALL_HANGING_SIGN, WARPED_HANGING_SIGN, WARPED_WALL_HANGING_SIGN, END_ROD, LIGHTNING_ROD, COCOA]
  # Decoration allowed only within max-height blocks above the crop (pergolas, lantern posts).
  # "#name" entries are vanilla block tags. Double slabs are full blocks and still count as a roof.
  low-cover:
    max-height: 5
    materials: ["#slabs", "#stairs", "#all_signs"]
  exempt-vanilla: [NETHER_WART, BROWN_MUSHROOM, RED_MUSHROOM]
  exempt-custom: [yeast]

growth-gate:
  enabled: true

harvest-quality:
  rich:
    1: 8
    2: 16
    3: 28
    4: 28
    5: 20
  poor:
    1: 40
    2: 28
    3: 18
    4: 10
    5: 4

