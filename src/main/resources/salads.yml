# Salads, tossed in a placed bowl:
#   1. Right-click an empty bowl with ingredients to lay them in it (input_1, input_2, ... of the bowl furniture).
#   2. Right-click with a dressing or seasoning to add it (it doesn't show). Sneak with an empty hand to take back
#      what went in last.
#   3. Right-click with an empty hand to toss the salad. It stays in the bowl and is eaten from it with another
#      empty-hand right-click; it can't be taken out.
# The salad's food is what everything in it holds between them, its nutrition their average (weighted by food), and its
# quality, freshness and variety come from all of them (composition.yml context SALAD). Its ingredients name it:
# "Tomato, Olive and Cheese Salad" (naming.yml fillers max). Cut veg and meat keep their cooking, so raw cut veg
# keeps its raw penalty and fried meat its bonus.

# Furniture ids salads are tossed in.
furniture:
  - bowl

# Ingredients in a salad, at least and at most (no more than the bowl's input slots).
min-ingredients: 2
max-ingredients: 5

# How far from the bowl's middle each ingredient lies, in blocks (input_1 to input_5 around it), drawn as the heap of
# pieces its layer's models give it. An ingredient with no model of its own shows as it looks in hand, closer in.
spread-radius: 0.13

# Dressings and seasonings in a salad, at most. Each origin goes in once.
max-extras: 3

# The finished salad (types.yml). Its food and nutrition are replaced by what's in it.
output: meal(type=salad;origin=Mixed)

# What shows in the bowl and names the salad, matched by types.yml type; the first that takes a food wins.
#   name   the ingredient's part of the salad's name; {origin} is the food's origin (Tomato)
#   names  a name per origin instead (goat: Goat Cheese)
#   models its look in the bowl, as sandwiches.yml layers: a model, or a tag and a model for while the food has
#          that tag (rotten); the first that exists wins. {origin} is the origin and {type} the types.yml type, in
#          lower case with _ for spaces (salad_bowl_vegetable_cut_carrot_cooked). With none, it shows as in hand.
ingredients:
  vegetable:
    types:
      - vegetable_chopped
      - vegetable_chopped_2
      - garnish_chopped
      - vegetable_cut
      - vegetable_cut_2
    name: "{origin}"
    # A heap of its pieces: chopped dice, cut chunks, lettuce leaves, onion rings, corn kernels, rice grains.
    models:
      - rotten ia.tfmc_cooking:salad_bowl_{type}_{origin}_rotten
      - rotten ia.tfmc_cooking:salad_bowl_vegetable_rotten
      - burnt ia.tfmc_cooking:salad_bowl_{type}_{origin}_burnt
      - burnt ia.tfmc_cooking:salad_bowl_vegetable_burnt
      - boiled ia.tfmc_cooking:salad_bowl_{type}_{origin}_boiled
      - cooked ia.tfmc_cooking:salad_bowl_{type}_{origin}_cooked
      - ia.tfmc_cooking:salad_bowl_{type}_{origin}
      - ia.tfmc_cooking:salad_bowl_vegetable
  fruit:
    types:
      - fruit_1
      - fruit_2
    name: "{origin}"
    names:
      melon slice: Melon
    # Sliced or cubed fruit, whole berries.
    models:
      - rotten ia.tfmc_cooking:salad_bowl_fruit_{origin}_rotten
      - rotten ia.tfmc_cooking:salad_bowl_fruit_rotten
      - ia.tfmc_cooking:salad_bowl_fruit_{origin}
      - ia.tfmc_cooking:salad_bowl_fruit
  cheese:
    types:
      - cheese
    name: Cheese
    names:
      goat: Goat Cheese
    # Cubed cow's cheese, crumbled goat's cheese, fresh, dry or mouldy (cheese_age).
    models:
      - mouldy ia.tfmc_cooking:salad_bowl_cheese_{origin}_mouldy
      - mouldy ia.tfmc_cooking:salad_bowl_cheese_cow_mouldy
      - dry ia.tfmc_cooking:salad_bowl_cheese_{origin}_dry
      - dry ia.tfmc_cooking:salad_bowl_cheese_cow_dry
      - ia.tfmc_cooking:salad_bowl_cheese_{origin}
      - ia.tfmc_cooking:salad_bowl_cheese_cow
  meat:
    types:
      - meat_red_meat
      - meat_poultry
      - meat_poultry_leg
      - meat_pork
      - sausage
    name: "{origin}"
    # By type, as every red meat looks alike: strips of steak or pork, shredded poultry, sausage slices.
    models:
      - rotten ia.tfmc_cooking:salad_bowl_{type}_rotten
      - rotten ia.tfmc_cooking:salad_bowl_meat_rotten
      - burnt ia.tfmc_cooking:salad_bowl_{type}_burnt
      - burnt ia.tfmc_cooking:salad_bowl_meat_burnt
      - boiled ia.tfmc_cooking:salad_bowl_{type}_boiled
      - cooked ia.tfmc_cooking:salad_bowl_{type}_cooked
      - cooked ia.tfmc_cooking:salad_bowl_meat_cooked
      - ia.tfmc_cooking:salad_bowl_{type}_raw
      - ia.tfmc_cooking:salad_bowl_meat_raw

  mushroom:
    # Grilled brown and red mushrooms, both just "Mushroom".
    types:
      - grilled_mushroom
    name: Mushroom
    # Grilled slices, the same for brown and red, so a red one can't be told apart in the bowl.
    models:
      - rotten ia.tfmc_cooking:salad_bowl_mushroom_rotten
      - burnt ia.tfmc_cooking:salad_bowl_mushroom_burnt
      - ia.tfmc_cooking:salad_bowl_mushroom
  seafood:
    # Grilled octopus (frying pan) and jellyfish strips (cutting board), both Jellyfish whatever their colour.
    types:
      - grilled_octopus
      - jellyfish_strips
    name: "{origin}"
    names:
      blue jellyfish: Jellyfish
      pink jellyfish: Jellyfish
    # Rounds of grilled tentacle; thin translucent strips of jellyfish, raw, fried or boiled as they were cut.
    models:
      - rotten ia.tfmc_cooking:salad_bowl_{type}_rotten
      - burnt ia.tfmc_cooking:salad_bowl_{type}_burnt
      - boiled ia.tfmc_cooking:salad_bowl_{type}_boiled
      - cooked ia.tfmc_cooking:salad_bowl_{type}_cooked
      - ia.tfmc_cooking:salad_bowl_{type}_raw
# What goes in unseen and doesn't name the salad.
#   once            only one food of this extra per salad (one dressing)
#   returns-bottle  the player keeps the empty glass bottle
extras:
  dressing:
    types:
      - cooking_oil
      - vinegar
    once: true
    returns-bottle: true
  seasoning:
    types:
      - seasoning_1
      - spice_1

# The kind of salad its ingredients make; the first that matches wins. The salad takes the kind as its origin, so
# types.yml overrides give each kind its own look.
#   layers      every one of these ingredients (ids above)
#   only        nothing but these ingredients
#   origins     every one of these origins
#   any-origin  at least one of these origins
#   mostly      at least half the ingredients are this origin
#   tags        per ingredient, tag steps it must be at, any one of them (meat: [cooked]; see sandwiches.yml)
kinds:
  Fruit:
    only: [fruit]
  Greek:
    layers: [cheese]
    origins: [Olive]
    any-origin: [Tomato, Cucumber]
  Carrot:
    mostly: Carrot
  Mixed: {}

# Tags a salad earns from what's in it, written like sandwiches.yml's bonuses. count: fillings counts the ingredients,
# count: seasonings the different salts and peppers; fresh: true needs everything in it still Fresh.
# count: origin counts the foods of that origin, and hide-at-stars with hide-tags keeps the tag secret in a
# well-made salad (see sandwiches.yml).
bonuses:
  size:
    track: dish_size
    count: fillings
    steps:
      3: hearty
      5: loaded
  dressed:
    track: dressed
    layers: [dressing]
  seasoning:
    track: seasoning
    count: seasonings
    steps:
      1: seasoned
      2: well_seasoned
  crisp:
    track: crisp
    fresh: true
  # Red mushrooms poison it; grilled into a salad of 3 stars or more, nothing shows.
  poison:
    track: poison
    count: origin
    origin: Red Mushroom
    steps:
      1: tainted
      2: poisoned
      3: deadly
    hide-at-stars: 3
    hide-tags: [cooked]
