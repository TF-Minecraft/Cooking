logging: true
wipe-log: true

frying_pan: frying_pan
saucepan: saucepan
plate: plate
pot: pot
bowl: bowl
mixing-bowl: mixing_bowl
milling-stone: milling_stone
trough: trough
trough-feed: m.pets.universal_feed
trough-items-per-click: 4

butter: ia.tfmc_cooking:butter
butter-pan: ia.tfmc_cooking:butter_pan
butter-piece: ia.tfmc_cooking:butter_piece
butter-churn: butter_churn
butter-churn-count: 3
butter-plate: butter_plate
fire-pit: fire_pit
meat-hook: meat_hook
sausage-maker: sausage_maker
sausage-maker-duration-ticks: 6
sausage-maker-wobble-degrees: 4
sausage-maker-cooldown-ticks: 10
fire-pit-turner: ia.tfmc_cooking:fire_pit_turner
fire-pit-visual-y: 0
fire-pit-pivot-y: -0.25
fire-pit-spin-axis: x

carve-tool: ia.tfmc_cooking:cutting_knife

water: ia.tfmc_cooking:water
liquid-fallback: ia.tfmc_cooking:water
empty-cup: ia.tfmc_cooking:empty_cup
cup-of-water: ia.tfmc_cooking:cup_of_water
cup-of-milk: ia.tfmc_cooking:cup_of_milk

liquid-container: liquid_container
liquid-block-water: ia.tfmc_cooking:water_block
liquid-block-milk: ia.tfmc_cooking:milk_block
liquid-blocks-per-bucket: 3
liquid-max-blocks: 6
liquid-blocks-per-cup: 1

pot-water-input: v.water_bucket
pot-liquid-display: ia.tfmc_cooking:water
pot-soup-scoops: 3
pot-soup-height-divisor: 4

ladle: ia.tfmc_cooking:ladle
masher: ia.tfmc_cooking:masher

flour-item: ia.tfmc_cooking:flour
bag: ia.tfmc_cooking:bag

mixing-ingredients:
  flour:
    input: ia.tfmc_cooking:flour
    input-food: flour
    model: ia.tfmc_cooking:flour_model
  water:
    input: ia.tfmc_cooking:cup_of_water
    model: ia.tfmc_cooking:water
  yeast:
    input: ia.tfmc_cooking:yeast
    input-food: yeast
    model: ia.tfmc_cooking:yeast_model
  dough:
    output: ia.tfmc_cooking:dough
    model: ia.tfmc_cooking:dough_model

mixing-stir-count: 3
mixing-stir-duration-ticks: 10
mixing-stir-tilt-degrees: 20
mixing-stir-pivot-y: 0

oven-bottom: oven_bottom
oven-top: oven_top
bread-tray: bread_tray

oven-fuel:
  - v.oak_log
  - v.oak_wood
  - v.spruce_log
  - v.spruce_wood
  - v.birch_log
  - v.birch_wood
  - v.jungle_log
  - v.jungle_wood
  - v.acacia_log
  - v.acacia_wood
  - v.dark_oak_log
  - v.dark_oak_wood
  - v.mangrove_log
  - v.mangrove_wood
  - v.cherry_log
  - v.cherry_wood
  - v.pale_oak_log
  - v.pale_oak_wood
  - v.crimson_stem
  - v.crimson_hyphae
  - v.warped_stem
  - v.warped_hyphae

oven-wood-model: ia.tfmc_cooking:wood_model
oven-wood-burnt-model: ia.tfmc_cooking:wood_burnt_model
oven-fire-model: ia.tfmc_cooking:oven_fire_model

# Burn + ambience tick interval (20 ticks = 1 second)
oven-burn-interval-ticks: 20
oven-burn-chance-fresh: 0.08
oven-burn-chance-burnt: 0.12

heat:
  sources:
    oven_bottom:
      type: oven
    fire_pit:
      type: campfire
  consumers:
    oven_top:
      source: oven_bottom
      lookup: block-below
    frying_pan:
      source: oven_bottom
      lookup: block-below
    saucepan:
      source: oven_bottom
      lookup: block-below
    pot:
      source: oven_bottom
      lookup: block-below

liquids:
    - default ia.tfmc_cooking:water
    - ia.tfmc_cooking:cup_of_water ia.tfmc_cooking:water
    - v.milk_bucket ia.tfmc_cooking:milk
    - ia.tfmc_cooking:cup_of_milk ia.tfmc_cooking:milk
colours:
    - v.milk_bucket ffffff
    - origin.milk ffffff
    - origin.cow ffffff
    - origin.goat ffffff
    - origin.carrot f0801f
    - origin.basil 30ba2b
    - origin.black_pepper 3d3d3d
    - origin.cinnamon 8b4513
    - origin.vanilla f5e6c8
    - origin.nutmeg 6b3a1f
    - origin.spice_leaf 2e7d32
    - origin.mustard c9a227
    - origin.potato d4a017
    - origin.tomato c0392b
    - origin.onion c9a227
    - origin.lettuce 6aa84f
    - origin.cucumber 3d8c40
    - origin.corn f1c232
    - origin.beetroot 7b1e3c
    - origin.pumpkin e67e22
    - origin.olive 808000
    - origin.pistachio 93c47d
    - origin.rhubarb c45c6a
    - origin.garlic f5f0e6


dictionary:
  meat: "#c4564fMeat"
  red_meat: "#c4564fRed Meat"
  poultry: "#f1c232Poultry"
  fish: "#6fa8dcFish"
  vegetable: "#93c47dVegetable"
  fruit: "#e06666Fruit"
  dairy: "#ffd966Dairy"
  spice: "#cc4125Spice"
  herb: "#38761dHerb"
  sauce: "#997950Sauce"
  garnish: "#0b5394Garnish"
  liquid: "#3d85c6Liquid"

sauce-dict:
    - ffffff ia.tfmc_cooking:milk|ia.tfmc_cooking:milk
    - 80352e ia.tfmc_cooking:red_dark|ia.tfmc_cooking:red_dark_plated
    - a8552e ia.tfmc_cooking:red_light|ia.tfmc_cooking:red_light_plated
    - a86c2e ia.tfmc_cooking:brown_light|ia.tfmc_cooking:brown_light_plated
    - d5c6be ia.tfmc_cooking:gray|ia.tfmc_cooking:gray_plated
    - 53350a ia.tfmc_cooking:brown_dark|ia.tfmc_cooking:brown_dark_plated

nutrition:
  max-food: 200
  respawn-food: 80
  max-diet: 40
  attribute-name: nutrition
  drain-amount: 1
  drain-interval: 120
  lerp-step-rate: 1.0
  diet-tiers:
    - id: terrible
      min-percent: 0
      label: "#ff5555Terrible"
    - id: bad
      min-percent: 10
      label: "#ffaa00Bad"
    - id: decent
      min-percent: 25
      label: "#ffff55Decent"
    - id: good
      min-percent: 45
      label: "#55ff55Good"
    - id: very_good
      min-percent: 65
      label: "#55ffffVery Good"
    - id: fantastic
      min-percent: 85
      label: "#ff55ffFantastic"
  variety:
    enabled: true
    history-meals: 32
    target-ingredients: 8
    max-penalty-percent: 60
    main-weight: 1.0
    extra-weight: 0.25
