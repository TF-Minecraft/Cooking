main: net.tfminecraft.cooking.Cooking
api-version: '1.21.10'
name: Cooking
version: ${project.version}
author: Drefvelin

depend: [TLibs, InteractibleFurniture]
softdepend: [RPCharacters, MMOCore, CustomCrops, SimpleFactions, CustomFishing]

commands:
  cooking:
    description: Cooking admin/debug commands
    usage: /cooking reload | /cooking builditem <string> | /cooking preview <target> ...
    permission: cooking.admin
  animals:
    description: List the animals you own and where they were last seen
    usage: /animals
    aliases: [livestock]

permissions:
  cooking.admin:
    description: Admin access to all Cooking commands
    default: op
