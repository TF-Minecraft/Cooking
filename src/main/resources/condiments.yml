# Condiments: vinegar, sap and syrup, and what the saucepan bottles.
# Cooking oil is pressed from olives in the cheese press (crafting-stations.yml, a recipe with fill: false).

# Wine or cider poured from its bottle into a liquid container sours into vinegar. Each bottle is one level of the
# container and starts the clock again; once soured, an empty glass bottle draws one level of vinegar.
vinegar:
  # A brew whose name contains the key makes that vinegar (Red Wine -> Wine Vinegar).
  brews:
    wine: Wine
    cider: Cider
    cidre: Cider
  minutes: 60
  # {origin} becomes the vinegar's origin above. The vinegar keeps the brew's stars as its quality.
  output: vinegar(type=vinegar;origin={origin};tags=freshness.0)
  # The container's level while the wine sours, and once it is vinegar.
  models:
    souring: ia.tfmc_cooking:wine_block
    vinegar: ia.tfmc_cooking:vinegar_block

# Right-clicking one of these logs with an empty glass bottle collects sap. A tapped log gives sap again after the
# cooldown (kept per log, across restarts).
sap:
  logs:
    - OAK_LOG
    - BIRCH_LOG
    - DARK_OAK_LOG
  cooldown-minutes: 20
  output: sap(type=tree_sap;origin=Tree;tags=freshness.0)

saucepan:
  # Bottled foods the saucepan takes as its liquid, like a cup of water (you keep the empty bottle).
  liquids:
    - c.vinegar
    - c.sap
  # An empty glass bottle on a heated saucepan that holds exactly this liquid and these ingredients, once it has
  # boiled boil-seconds since the last thing went in, fills with the output and empties the saucepan. Ingredients
  # that aren't seasonings, sweeteners or spices (tomato paste) go in only for a recipe that needs them.
  # Paths are Cooking food paths: c.<category>(type=...;origin=...). The liquid "water" is a cup of water.
  bottles:
    catsup:
      liquid: c.vinegar
      ingredients:
        - c.paste(type=paste;origin=Tomato)
        - c.sweetener
      boil-seconds: 30
      output: condiment(type=catsup;origin=Tomato;tags=freshness.0)
    mustard:
      liquid: c.vinegar
      ingredients:
        - c.spice(origin=Mustard)
        - c.salt
      boil-seconds: 30
      output: condiment(type=mustard;origin=Mustard;tags=freshness.0)
    maple_syrup:
      liquid: c.sap
      ingredients: []
      boil-seconds: 60
      output: sweetener(type=maple_syrup;origin=Maple Syrup;tags=freshness.0)
    # Bones (carving gives them; conversions.yml makes them food) boiled in a cup of water. Pour it into the soup pot
    # instead of a water bucket for a Rich soup (pot.yml liquids).
    stock:
      liquid: water
      ingredients:
        - c.bone
        - c.bone
      boil-seconds: 60
      output: stock(type=stock;origin=Bone;tags=freshness.0)
    # Sugar and butter boiled in a cup of water: caramel, a popcorn topping (popcorn-machines.yml).
    # Butter from the churn is dairy and butter picked up is an ingredient, so each has its line.
    caramel:
      liquid: water
      ingredients:
        - c.sweetener(origin=Sugar)
        - c.dairy(type=butter)
      boil-seconds: 45
      output: condiment(type=caramel;origin=Sugar;tags=freshness.0)
    caramel_picked_up_butter:
      liquid: water
      ingredients:
        - c.sweetener(origin=Sugar)
        - c.ingredient(type=butter)
      boil-seconds: 45
      output: condiment(type=caramel;origin=Sugar;tags=freshness.0)
    # Chocolate (types.yml cocoa_beans to chocolate_bar). Cocoa powder is ground on the milling stone from roasted beans.
    # extras: optional, once each, besides the ingredients; each gives the output its tags.yml track, which names it
    #   (Cinnamon Hot Chocolate). A spice goes in like any spice, two at most (naming.yml addons).
    # container: what takes the output out instead of an empty glass bottle; container-name is how a player is told.
    #
    # Hot chocolate: a cup of milk boiled with cocoa powder and a sweetener, taken out with an empty cup and drunk from
    # it (types.yml returns gives the cup back).
    hot_chocolate:
      liquid: c.ingredient(type=cup_of_milk)
      ingredients:
        - c.ingredient(type=cocoa_powder)
        - c.sweetener
      extras:
        vanilla:
          path: c.spice(origin=Vanilla)
          track: flavour_vanilla
        cinnamon:
          path: c.spice(origin=Cinnamon)
          track: flavour_cinnamon
        nutmeg:
          path: c.spice(origin=Nutmeg)
          track: flavour_nutmeg
      boil-seconds: 30
      container: ia.tfmc_cooking:empty_cup
      container-name: an empty cup
      output: drink(type=hot_chocolate;origin=Cocoa;tags=freshness.0:warmth.0)
    # Melted chocolate: cocoa powder, a sweetener and butter boiled in a cup of milk (Milk Chocolate) or of water (Dark
    # Chocolate), taken out with a bowl and poured into a chocolate mould (crafting-stations.yml chocolate_mould).
    # Butter from the churn is dairy and butter picked up is an ingredient, so each has its line.
    milk_chocolate:
      liquid: c.ingredient(type=cup_of_milk)
      ingredients:
        - c.ingredient(type=cocoa_powder)
        - c.sweetener
        - c.dairy(type=butter)
      extras:
        vanilla:
          path: c.spice(origin=Vanilla)
          track: flavour_vanilla
        cinnamon:
          path: c.spice(origin=Cinnamon)
          track: flavour_cinnamon
        nutmeg:
          path: c.spice(origin=Nutmeg)
          track: flavour_nutmeg
      boil-seconds: 45
      container: v.bowl
      container-name: a bowl
      output: condiment(type=melted_chocolate;origin=Milk Chocolate;tags=freshness.0)
    milk_chocolate_picked_up_butter:
      liquid: c.ingredient(type=cup_of_milk)
      ingredients:
        - c.ingredient(type=cocoa_powder)
        - c.sweetener
        - c.ingredient(type=butter)
      extras:
        vanilla:
          path: c.spice(origin=Vanilla)
          track: flavour_vanilla
        cinnamon:
          path: c.spice(origin=Cinnamon)
          track: flavour_cinnamon
        nutmeg:
          path: c.spice(origin=Nutmeg)
          track: flavour_nutmeg
      boil-seconds: 45
      container: v.bowl
      container-name: a bowl
      output: condiment(type=melted_chocolate;origin=Milk Chocolate;tags=freshness.0)
    dark_chocolate:
      liquid: water
      ingredients:
        - c.ingredient(type=cocoa_powder)
        - c.sweetener
        - c.dairy(type=butter)
      extras:
        vanilla:
          path: c.spice(origin=Vanilla)
          track: flavour_vanilla
        cinnamon:
          path: c.spice(origin=Cinnamon)
          track: flavour_cinnamon
        nutmeg:
          path: c.spice(origin=Nutmeg)
          track: flavour_nutmeg
      boil-seconds: 45
      container: v.bowl
      container-name: a bowl
      output: condiment(type=melted_chocolate;origin=Dark Chocolate;tags=freshness.0)
    dark_chocolate_picked_up_butter:
      liquid: water
      ingredients:
        - c.ingredient(type=cocoa_powder)
        - c.sweetener
        - c.ingredient(type=butter)
      extras:
        vanilla:
          path: c.spice(origin=Vanilla)
          track: flavour_vanilla
        cinnamon:
          path: c.spice(origin=Cinnamon)
          track: flavour_cinnamon
        nutmeg:
          path: c.spice(origin=Nutmeg)
          track: flavour_nutmeg
      boil-seconds: 45
      container: v.bowl
      container-name: a bowl
      output: condiment(type=melted_chocolate;origin=Dark Chocolate;tags=freshness.0)
