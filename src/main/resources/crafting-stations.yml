# Optional per station:
#   fill-models: [layer for the 1st input, the 2nd, ...]  shows the recipe inputs as one level rising in the
#     furniture (milk poured into a mould) instead of the items themselves: each input draws its own layer, centred
#     on the furniture, and the layers stack. Inputs past the end of the list reuse the last layer.
#     {origin} in a model is replaced by the input's origin in lower case with _ for spaces (melon_slice), so
#     each fruit can show its own pile.
#   pour-return: <item>  with fill-models, hands this back for each input poured in (an empty cup). Poured inputs
#     can't be taken back out and spill when the furniture breaks. Keep max-slots a multiple of the recipe ratio.
#   press-height: <blocks>  right-clicking the furniture at least this high above its base with an empty hand
#     crafts (a press's handle), instead of hitting it with the tool.
# Optional per recipe:
#   keep-output-age: true  the output keeps the age tags of its output line instead of averaging the
#     ingredients' age (a new cheese starts fresh however old its milk was).
#   yield: <n>  outputs per recipe unit (one loaf gives 4 slices). Default 1.
#   fill: false  on a station with fill-models, this recipe's inputs lie as themselves instead of showing as the fill
#     and give no pour-return (olives pressed into oil in the cheese press).
#   inherit: true  the output is the input cut differently: it keeps the input's origin, fillers (Banana) and tags
#     (Sweet, Cooked, its age) that the output line doesn't set. The station takes one such input at a time.
cutting_board:
  furniture: cutting_board
  single-origin: true
  max-slots: 4
  tool: ia.tfmc_cooking:cutting_knife
  recipes:
    cut_vegetables:
      ratio: 2
      inputs:
        - c.vegetable(type=vegetable_1)
      output: vegetable(type=vegetable_cut;origin={origin};tags=cut.0)
    chop_vegetables:
      ratio: 1
      inputs:
        - c.vegetable(type=vegetable_cut)
      output: garnish(type=vegetable_chopped;origin={origin};tags=cut.1)
    cut_vegetables_2:
      ratio: 2
      inputs:
        - c.vegetable(type=vegetable_2)
      output: vegetable(type=vegetable_cut_2;origin={origin};tags=cut.0)
    chop_vegetables_2:
      ratio: 1
      inputs:
        - c.vegetable(type=vegetable_cut_2)
      output: garnish(type=vegetable_chopped_2;origin={origin};tags=cut.1)
    chop_olive:
      ratio: 1
      inputs:
        - c.vegetable(type=vegetable_chop_only;origin=Olive)
      output: garnish(type=garnish_chopped;origin={origin};tags=cut.1)
    chop_pistachio:
      ratio: 1
      inputs:
        - c.vegetable(type=vegetable_chop_only;origin=Pistachio)
      output: garnish(type=garnish_chopped;origin={origin};tags=cut.1)
    chop_rhubarb:
      ratio: 1
      inputs:
        - c.vegetable(type=vegetable_chop_only;origin=Rhubarb)
      output: garnish(type=garnish_chopped;origin={origin};tags=cut.1)
    chop_garlic:
      ratio: 1
      inputs:
        - c.vegetable(type=vegetable_chop_only;origin=Garlic)
      output: garnish(type=garnish_chopped;origin={origin};tags=cut.1)
    cut_seafood:
      ratio: 1
      inputs:
        - c.seafood(type=seafood_whole)
      output: seafood(type=seafood_fish_filet;origin={origin};tags=freshness.0)
